<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eaf1f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="聆聆 AI" />
    <title>聆聆 AI</title>
    <!--
      品牌字体：Noto Serif SC（只取「聆」一个字形）+ Cormorant Garamond（只取英文字母、数字、冒号和逗号，用于品牌名与桌面时钟），
      均为 SIL OFL 开源授权。用 text= 子集，体积只有几 KB；media=print + onload 异步加载，
      不阻塞首屏。网络无法访问 Google Fonts 时自动回退到 iOS 自带的宋体（Songti SC）。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&family=Cormorant+Garamond:ital,wght@0,500;1,500&text=%E8%81%86ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789%3A%2C%20&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- 英文花体点缀（SIL OFL）；加载不到时回退到 iOS 自带的 Snell Roundhand -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
